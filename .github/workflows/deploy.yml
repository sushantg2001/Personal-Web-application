# .github/workflows/deploy.yml
#
# CD — runs on push to main (after PR merges).
#
# Pattern: build-once → scan → promote-by-digest
#   1. build   — builds and pushes the image to GHCR; emits the immutable digest
#   2. trivy   — scans the built image for OS-package CVEs (catches what FS scan misses)
#   3. deploy  — SSHs to VM and deploys using the digest, not a mutable tag
#   4. health  — polls the live URL; fails the run (and alerts) if the site doesn't respond
#
# This mirrors the "build-once, promote-many" pattern from the CI/CD concepts:
# the exact image that was scanned is what lands in production — no rebuilds, no surprises.

name: Deploy

on:
  push:
    branches: [main]

# Never cancel an in-flight deploy — let it finish or fail cleanly.
# A new push while deploying will queue, not stomp.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/website

jobs:
  # ── 1. Build & push ─────────────────────────────────────────────────────────
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image-uri: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Write a deployment manifest: the contract between build and deploy jobs.
      # Downstream stages consume the digest (immutable), never the tag (mutable).
      - name: Write deploy manifest
        run: |
          cat > manifest.json << EOF
          {
            "image": "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}",
            "digest": "${{ steps.build.outputs.digest }}",
            "sha_tag": "sha-${{ github.sha }}",
            "commit_sha": "${{ github.sha }}",
            "run_id": "${{ github.run_id }}",
            "built_at": "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          }
          EOF
          cat manifest.json

      - name: Upload deploy manifest
        uses: actions/upload-artifact@v4
        with:
          name: deploy-manifest
          path: manifest.json
          retention-days: 90

  # ── 2. Trivy image scan (post-build) ────────────────────────────────────────
  trivy-image:
    name: Trivy Image Scan
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: read
      security-events: write
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Scan by digest — guarantees we're scanning exactly what was built.
      # This catches OS-package CVEs introduced by the base image (nginx:alpine)
      # that the FS scan in CI cannot see.
      #
      # Two invocations, split on purpose: see ci.yml's Trivy FS Scan job for
      # why SARIF generation and the CRITICAL/HIGH gate can't share one run.
      - name: Trivy — generate SARIF report for GitHub Security tab
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-uri }}@${{ needs.build.outputs.digest }}
          exit-code: '0'
          format: sarif
          output: trivy-image.sarif

      - uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif

      - name: Trivy — fail on CRITICAL/HIGH findings
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ needs.build.outputs.image-uri }}@${{ needs.build.outputs.digest }}
          exit-code: '1'
          severity: CRITICAL,HIGH
          format: table

  # ── 3. Deploy to VM (by digest) ─────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: [build, trivy-image]
    runs-on: ubuntu-latest
    environment: production   # shows "production" environment badge on the run

    steps:
      - name: Download deploy manifest
        uses: actions/download-artifact@v4
        with:
          name: deploy-manifest

      - name: Deploy to VM
        uses: appleboy/ssh-action@v1.0.3
        env:
          DIGEST: ${{ needs.build.outputs.digest }}
          IMAGE_URI: ${{ needs.build.outputs.image-uri }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          port: ${{ secrets.VM_PORT }}
          envs: DIGEST,IMAGE_URI,ACTOR,TOKEN
          script: |
            echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin

            # Deploy by digest — immutable; the exact image that passed Trivy.
            cd ~/website
            docker compose pull "${IMAGE_URI}@${DIGEST}"
            IMAGE_WITH_DIGEST="${IMAGE_URI}@${DIGEST}" \
              docker compose up -d --force-recreate

            docker image prune -f
            echo "✓ Deployed ${IMAGE_URI}@${DIGEST} at $(date -u)"

  # ── 4. Health check ──────────────────────────────────────────────────────────
  health-check:
    name: Post-deploy Health Check
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      # Poll the live site for up to 60 s. If it never responds, the workflow
      # fails — which surfaces a broken deploy immediately rather than silently.
      - name: Wait for site to be healthy
        run: |
          echo "Polling https://sushantgupta.cloud ..."
          for i in $(seq 1 12); do
            if curl -sf --max-time 10 https://sushantgupta.cloud > /dev/null; then
              echo "✓ Site healthy (attempt $i)"
              exit 0
            fi
            echo "  attempt $i/12 — waiting 5 s"
            sleep 5
          done
          echo "✗ Health check failed after 60 s"
          exit 1
