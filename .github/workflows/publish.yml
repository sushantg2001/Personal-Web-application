# .github/workflows/publish.yml
#
# Blog publishing. Drop a markdown file into content/inbox/ — exported
# from Obsidian by `just publish`, or written by hand — and merge it to main.
# This turns it into a post and opens a pull request with the result:
#
#   content/inbox/post.md   →  content/blog/post.md
#   content/inbox/images/   →  public/blog/images/
#
# Obsidian image wikilinks become plain markdown paths, frontmatter is checked,
# and the inbox is emptied. Merging that pull request lands the post on main,
# which builds an image (image.yml); the post goes live with the next signed-tag
# release (release.yml).
#
# This opens a pull request instead of pushing to main because main takes only
# signed commits and a squash-merged PR. Pull requests opened
# with GITHUB_TOKEN start no workflows, so CI does not run on it; the transform
# already validates frontmatter, images and wikilinks, and the image is built
# after the merge and scanned when it is released. Repository settings must allow "Allow GitHub
# Actions to create and approve pull requests" (`just github repo --harden` sets it).
#
# Nothing here deletes an existing post. The repo is the source of truth and
# the inbox is only ever a set of additions.

name: Publish

on:
  push:
    branches: [main]
    paths:
      - 'content/inbox/**'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    name: Transform inbox posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4

      - name: Transform
        id: transform
        run: just content-apply

      - name: Open a pull request with the published posts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "nothing to publish"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # type/slug, so the branch-names ruleset accepts it
          branch="docs/publish-posts-${GITHUB_RUN_ID}"
          git switch -c "$branch"
          git add content public/blog
          posts=$(git diff --cached --name-only --diff-filter=A \
                  -- 'content/blog/*.md' | wc -l)
          title="docs(blog): publish ${posts} post(s)"
          git commit -m "${title}

          Transformed from content/inbox/ by publish.yml."
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "$title" \
            --body "Transformed from \`content/inbox/\` by publish.yml. Squash-merge it; the post goes live with the next signed-tag release."
